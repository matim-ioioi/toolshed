name: Commitlint

on:
  pull_request:

# Джоб выполняет код из ветки pull request'а (установка зависимостей), поэтому
# даём ему только чтение и не полагаемся на секреты: для pull request из форков
# GitHub и так выдаёт read-only токен и не передаёт секреты репозитория.
permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Полная история нужна, чтобы commitlint видел все коммиты диапазона PR.
          fetch-depth: 0
      # Версия node зафиксирована конкретным патчем (а не плавающим 22.x): некоторые
      # сборки corepack уходили в npm-registry за "latest stable" pnpm ещё до чтения
      # packageManager и падали на проверке подписи. 22.23.1 несёт исправленный corepack.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      # corepack prepare pnpm@X --activate намеренно не используется: он кеширует
      # версию без учёта хэша, и любой следующий pnpm@9.15.4+sha512.* (в т.ч.
      # подделанный) отдавался бы из кеша без проверки. Версию и её sha512 берём
      # только из packageManager в package.json — так проверка целостности работает.
      - name: Enable pnpm via corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint commit messages
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
